<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- Strict Anti-Cache Directives for Mobile Chrome, Safari & WebViews -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Aapke Kareeb | आपके करीब — Alwar Hyperlocal</title>

    <!-- 🛡️ Safe One-Time Cache Cleaner & Lazy-Chunk Auto-Healer (Zero Loops) -->
    <script>
      (function () {
        var RELOAD_LOCK_KEY = 'ak_chunk_reload_lock';

        // Purge stale Service Workers & CacheStorage silently
        function purgeStaleCaches() {
          var tasks = [];
          if ('caches' in window) {
            tasks.push(
              window.caches
                .keys()
                .then(function (keys) {
                  return Promise.all(
                    keys.map(function (k) {
                      return window.caches.delete(k);
                    })
                  );
                })
                .catch(function () {})
            );
          }
          if ('serviceWorker' in navigator) {
            tasks.push(
              navigator.serviceWorker
                .getRegistrations()
                .then(function (regs) {
                  return Promise.all(
                    regs.map(function (reg) {
                      return reg.unregister();
                    })
                  );
                })
                .catch(function () {})
            );
          }
          return Promise.all(tasks);
        }

        // Only if a lazy-loaded chunk fails after a new Vercel deploy, heal once per session
        window.addEventListener('vite:preloadError', function (event) {
          event.preventDefault();
          var lastReload = Number(sessionStorage.getItem(RELOAD_LOCK_KEY) || 0);
          // Prevent any reload loop (only allow once every 60 seconds max)
          if (Date.now() - lastReload < 60000) return;

          sessionStorage.setItem(RELOAD_LOCK_KEY, String(Date.now()));
          purgeStaleCaches().finally(function () {
            window.location.reload();
          });
        });
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-400 selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
