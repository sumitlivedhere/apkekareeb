<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- Strict Anti-Cache Directives for Mobile Chrome, Safari & WebViews -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Aapke Kareeb | आपके करीब — Alwar Hyperlocal</title>

    <!-- 🚀 Zero-Dependency Live Deployment Sync & Lazy-Chunk Auto-Healer -->
    <script>
      (function () {
        var BUNDLE_STORAGE_KEY = 'aapkekareeb_active_bundle_hash';
        var isReloading = false;

        // Extract Vite's hashed entry script (e.g., /assets/index-xxxxx.js)
        function getRunningBundleSrc() {
          var scripts = document.querySelectorAll('script[src]');
          for (var i = 0; i < scripts.length; i++) {
            var src = scripts[i].getAttribute('src') || '';
            if (src.indexOf('/assets/index-') !== -1) {
              return src.split('?')[0];
            }
          }
          return null;
        }

        // Purge all browser CacheStorage & stale Service Workers
        function purgeBrowserCaches() {
          var promises = [];
          if ('caches' in window) {
            promises.push(
              window.caches
                .keys()
                .then(function (keys) {
                  return Promise.all(
                    keys.map(function (k) {
                      return window.caches.delete(k);
                    })
                  );
                })
                .catch(function () {})
            );
          }
          if ('serviceWorker' in navigator) {
            promises.push(
              navigator.serviceWorker
                .getRegistrations()
                .then(function (regs) {
                  return Promise.all(
                    regs.map(function (reg) {
                      return reg.unregister();
                    })
                  );
                })
                .catch(function () {})
            );
          }
          return Promise.all(promises);
        }

        // Fetch live /index.html from Vercel with no-store and compare bundle hash
        function checkVercelLiveUpdate(onUpdateCallback) {
          if (isReloading) return;

          var currentBundle = getRunningBundleSrc();
          // Skip in local 'npm run dev' where Vite serves /src/main.jsx
          if (!currentBundle) return;

          fetch('/index.html?_cb=' + Date.now(), {
            cache: 'no-store',
            headers: {
              'Cache-Control': 'no-cache, no-store, must-revalidate',
              Pragma: 'no-cache',
            },
          })
            .then(function (res) {
              if (!res.ok) return null;
              return res.text();
            })
            .then(function (html) {
              if (!html) return;
              var match = html.match(/\/assets\/index-[a-zA-Z0-9_-]+\.js/);
              var latestServerBundle = match ? match[0] : null;

              if (latestServerBundle && latestServerBundle !== currentBundle) {
                isReloading = true;
                try {
                  localStorage.setItem(BUNDLE_STORAGE_KEY, latestServerBundle);
                } catch (e) {}

                if (typeof onUpdateCallback === 'function') {
                  onUpdateCallback(latestServerBundle);
                }

                purgeBrowserCaches().finally(function () {
                  setTimeout(function () {
                    window.location.reload();
                  }, 800);
                });
              } else {
                try {
                  localStorage.setItem(BUNDLE_STORAGE_KEY, currentBundle);
                } catch (e) {}
              }
            })
            .catch(function () {});
        }

        // Expose globally for App.jsx
        window.__akCheckLiveUpdate = checkVercelLiveUpdate;
        window.__akPurgeCaches = purgeBrowserCaches;

        // Re-verify immediately if mobile browser restores from back-forward cache
        window.addEventListener('pageshow', function (event) {
          if (event.persisted) {
            checkVercelLiveUpdate();
          }
        });

        // Auto-heal if a React.lazy() chunk hash changed after a new Vercel deployment
        window.addEventListener('vite:preloadError', function (event) {
          event.preventDefault();
          purgeBrowserCaches().finally(function () {
            window.location.reload();
          });
        });
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-400 selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
